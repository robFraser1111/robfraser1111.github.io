name: Link check

# Public repository. This job uses ubuntu-latest only. GitHub-hosted Linux
# minutes are free for public repositories, which avoids the account's past
# Actions spending-limit failures on paid runner types.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, Monday 06:17 UTC. Scheduled runs only fire from the default branch.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          # No site build: pages are committed HTML. `--root-dir` maps
          # root-relative hrefs onto the checkout. Settings for retries,
          # timeouts, accepted statuses, anchors, and excluded domains
          # live in lychee.toml.
          args: >-
            --config lychee.toml
            --root-dir "${{ github.workspace }}"
            --verbose
            --no-progress
            "./**/*.html"
          fail: true
          failIfEmpty: true
          token: ${{ github.token }}
